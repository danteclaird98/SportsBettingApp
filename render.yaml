services:
  - type: web
    name: edgeboard-next
    runtime: docker
    plan: starter
    dockerfilePath: ./next_app/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: WORKSPACE_USER
        value: owner
      - key: WORKSPACE_PASSWORD
        generateValue: true
      - key: WORKSPACE_API_KEY
        generateValue: true
    disk:
      name: edgeboard-data
      mountPath: /var/data
      sizeGB: 1
