# Replace this template name with your actual Fly app name before deployment.
app = "edgeboard-replace-me"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "next_app/Dockerfile"
  build-target = "fly-runtime"

[env]
  WORKSPACE_USER = "owner"
  PORT = "10000"

[[mounts]]
  source = "edgeboard_data"
  destination = "/var/data"
  initial_size = "1gb"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
